name: Thursday Night Game Update

on:
  schedule:
    # Wednesday 21:41 UTC, before Thursday Night Football (off the hour on
    # purpose — see weekly_update.yml).
    - cron: '41 21 * * 3'
  workflow_dispatch:
    inputs:
      skip_guard:
        description: 'Run even in the offseason (bypass guard)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nfl-pipeline
  cancel-in-progress: false

jobs:
  thursday-update:
    runs-on: ubuntu-latest
    # predict_only retrains when the cached model is missing or stale, so
    # allow for a full training run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Offseason guard
        id: guard
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_guard }}" = "true" ]; then
            ARGS="--force"
          fi
          echo "decision=$(python3 scripts/season_guard.py $ARGS)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.decision == 'run'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (CPU-only torch)
        if: steps.guard.outputs.decision == 'run'
        run: |
          pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Restore model artifacts
        if: steps.guard.outputs.decision == 'run'
        uses: actions/cache@v4
        with:
          path: |
            model/saved
            !model/saved/version.txt
          key: model-saved-v4-${{ github.run_id }}
          restore-keys: model-saved-v4-

      - name: Refresh predictions
        if: steps.guard.outputs.decision == 'run'
        run: |
          set -o pipefail
          python -u model/pipeline.py --mode predict_only 2>&1 | tee -a run_console.log

      - name: Commit updated predictions
        if: steps.guard.outputs.decision == 'run'
        run: |
          git config user.name  "NFL Predictor Bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          git add docs/assets/ data/predictions/predictions_latest.json \
                  data/predictions/performance.json model/saved/version.txt
          git diff --staged --quiet || git commit -m "TNF refresh — $(date -u '+%Y-%m-%d')"
          bash scripts/push_with_retry.sh

      - name: Publish run log
        if: always() && steps.guard.outputs.decision == 'run'
        run: |
          git config user.name  "NFL Predictor Bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          {
            echo "=== thursday $(date -u '+%Y-%m-%dT%H:%MZ') — status: ${{ job.status }} ==="
            echo "--- console (tail) ---"
            tail -c 40000 run_console.log 2>/dev/null || echo "(no console log)"
          } > data/logs/thursday_last.txt
          git add data/logs/thursday_last.txt
          git commit -m "Thursday run log" || true
          bash scripts/push_with_retry.sh
