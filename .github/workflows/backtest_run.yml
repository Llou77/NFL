# Standalone backtest: one job per season (the two most recent completed
# seasons), then a merge job that commits backtest_results.json.
# Trigger: Actions UI, `gh workflow run backtest_run.yml`, or a push touching .backtest-trigger
name: Backtest (parallel matrix)

on:
  push:
    branches: [main]
    paths: ['.backtest-trigger']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-pipeline
  cancel-in-progress: false

jobs:
  # The two most recent completed seasons, derived from the date.
  seasons:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.s.outputs.list }}
    steps:
      - id: s
        run: |
          python3 -c "
          from datetime import date
          t = date.today(); cur = t.year if t.month >= 3 else t.year - 1
          print(f'list=[{cur - 2}, {cur - 1}]')" >> "$GITHUB_OUTPUT"

  backtest:
    needs: seasons
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        season: ${{ fromJSON(needs.seasons.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Backtest season ${{ matrix.season }}
        run: |
          set -o pipefail
          python -u model/pipeline.py --mode backtest --backtest-season ${{ matrix.season }} 2>&1 | tee -a run_console.log

      - name: Upload fragment
        uses: actions/upload-artifact@v4
        with:
          name: backtest-fragment-${{ matrix.season }}
          path: data/predictions/backtest_fragments/backtest_${{ matrix.season }}.json

      # Anonymous visitors cannot read Actions logs — commit the failure tail.
      - name: Publish failure log
        if: failure()
        run: |
          git config user.name  "NFL Predictor Bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          {
            echo "=== backtest ${{ matrix.season }} $(date -u '+%Y-%m-%dT%H:%MZ') — status: FAILURE ==="
            tail -c 30000 run_console.log 2>/dev/null || echo "(no console log)"
          } > data/logs/backtest_${{ matrix.season }}_fail.txt
          git add data/logs/backtest_${{ matrix.season }}_fail.txt
          git commit -m "Backtest ${{ matrix.season }} failure log" || true
          bash scripts/push_with_retry.sh

  merge_backtests:
    needs: backtest
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          pattern: backtest-fragment-*
          merge-multiple: true
          path: data/predictions/backtest_fragments/

      - name: Merge fragments
        run: python3 scripts/merge_backtests.py 2>&1 | tee -a merge_console.log

      - name: Commit backtest results + log
        if: always()
        run: |
          git config user.name  "NFL Predictor Bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          {
            echo "=== backtest $(date -u '+%Y-%m-%dT%H:%MZ') — merge status: ${{ job.status }} ==="
            echo "backtest jobs: ${{ needs.backtest.result }}"
            echo "--- merge log ---"
            cat merge_console.log 2>/dev/null || echo "(no merge log)"
          } > data/logs/backtest_last.txt
          git add data/logs/backtest_last.txt data/predictions/backtest_results.json \
                  docs/assets/backtest_results.json
          git diff --staged --quiet || git commit -m "Backtest results — $(date -u '+%Y-%m-%d %H:%M')"
          bash scripts/push_with_retry.sh
