# Standalone train + predict (~8-12 min).
# Trigger: Actions UI, `gh workflow run train_run.yml`, or a push touching .train-trigger
name: Train + Predict (standalone)

on:
  push:
    branches: [main]
    paths: ['.train-trigger']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-pipeline
  cancel-in-progress: false

jobs:
  train_predict:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache model artifacts
        uses: actions/cache@v4
        with:
          path: |
            model/saved
            !model/saved/version.txt
          key: model-saved-v4-${{ github.run_id }}
          restore-keys: model-saved-v4-

      - name: Train + predict
        run: |
          set -o pipefail
          python -u model/pipeline.py --mode full 2>&1 | tee -a run_console.log

      - name: Commit predictions
        run: |
          git config user.name  "NFL Predictor Bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          git add docs/assets/ data/predictions/predictions_latest.json \
                  data/predictions/performance.json model/saved/version.txt
          git diff --staged --quiet || git commit -m "Train/predict — $(date -u '+%Y-%m-%d %H:%M')"
          bash scripts/push_with_retry.sh

      - name: Publish stage log
        if: always()
        run: |
          git config user.name  "NFL Predictor Bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          {
            echo "=== train(standalone) $(date -u '+%Y-%m-%dT%H:%MZ') — status: ${{ job.status }} ==="
            echo "--- console (tail) ---"
            tail -c 40000 run_console.log 2>/dev/null || echo "(no console log)"
          } > data/logs/train_last.txt
          git add data/logs/train_last.txt
          git commit -m "Train stage log" || true
          bash scripts/push_with_retry.sh
