name: Weekly NFL Prediction Update

on:
  schedule:
    # Tuesday 10:23 UTC. Off the top of the hour on purpose: GitHub delays
    # (or drops) scheduled runs at :00 under load — the old '0 10' slot
    # actually started 6-9 hours late every week in 2026.
    - cron: '23 10 * * 2'
  workflow_dispatch:
    inputs:
      force_data:
        description: 'Force re-download of live data'
        required: false
        default: false
        type: boolean
      skip_guard:
        description: 'Run even in the offseason (bypass guard)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: nfl-pipeline
  cancel-in-progress: false

jobs:
  update-predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Runs before the pip install: an offseason run exits in ~30 seconds.
      - name: Offseason guard
        id: guard
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_guard }}" = "true" ]; then
            ARGS="--force"
          fi
          echo "decision=$(python3 scripts/season_guard.py $ARGS)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.decision == 'run'
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (CPU-only torch)
        if: steps.guard.outputs.decision == 'run'
        run: |
          pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # Saves this run's trained model so the Thursday job can reuse it.
      # version.txt is committed, so it is excluded from the cache.
      - name: Cache model artifacts
        if: steps.guard.outputs.decision == 'run'
        uses: actions/cache@v4
        with:
          path: |
            model/saved
            !model/saved/version.txt
          key: model-saved-v4-${{ github.run_id }}
          restore-keys: model-saved-v4-

      - name: Run weekly pipeline
        if: steps.guard.outputs.decision == 'run'
        run: |
          set -o pipefail
          FORCE=""
          [ "${{ inputs.force_data }}" = "true" ] && FORCE="--force-data"
          python -u model/pipeline.py --mode full $FORCE 2>&1 | tee -a run_console.log

      - name: Commit updated predictions
        if: steps.guard.outputs.decision == 'run'
        run: |
          git config user.name  "NFL Predictor Bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          git add docs/assets/ data/predictions/predictions_latest.json \
                  data/predictions/performance.json model/saved/version.txt
          git diff --staged --quiet || git commit -m "Weekly update — $(date -u '+%Y-%m-%d')"
          bash scripts/push_with_retry.sh

      - name: Publish run log
        if: always() && steps.guard.outputs.decision == 'run'
        run: |
          git config user.name  "NFL Predictor Bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          {
            echo "=== weekly $(date -u '+%Y-%m-%dT%H:%MZ') — status: ${{ job.status }} ==="
            echo "--- console (tail) ---"
            tail -c 40000 run_console.log 2>/dev/null || echo "(no console log)"
          } > data/logs/weekly_last.txt
          git add data/logs/weekly_last.txt
          git commit -m "Weekly run log" || true
          bash scripts/push_with_retry.sh
