# Staged full run: train + predict → backtest (one job per season, parallel)
# → merge and publish. Every job stays well under 20 minutes and can be
# re-run on its own from the Actions UI.
#
# Start it from the Actions UI, with `gh workflow run full_pipeline.yml`, or
# with a push that touches .full-trigger:
#   date > .full-trigger && git add .full-trigger && git commit -m "run" && git push
name: Full Pipeline (staged)

on:
  push:
    branches: [main]
    paths: ['.full-trigger']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-pipeline
  cancel-in-progress: false

jobs:
  train_predict:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Cache model artifacts
        uses: actions/cache@v4
        with:
          path: |
            model/saved
            !model/saved/version.txt
          key: model-saved-v4-${{ github.run_id }}
          restore-keys: model-saved-v4-

      - name: Train + predict
        run: |
          set -o pipefail
          python -u model/pipeline.py --mode full 2>&1 | tee -a run_console.log

      - name: Commit predictions
        run: |
          git config user.name  "NFL Predictor Bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          git add docs/assets/ data/predictions/predictions_latest.json \
                  data/predictions/performance.json model/saved/version.txt
          git diff --staged --quiet || git commit -m "Train/predict — $(date -u '+%Y-%m-%d %H:%M')"
          bash scripts/push_with_retry.sh

      - name: Publish stage log
        if: always()
        run: |
          git config user.name  "NFL Predictor Bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          {
            echo "=== train_predict $(date -u '+%Y-%m-%dT%H:%MZ') — status: ${{ job.status }} ==="
            echo "--- console (tail) ---"
            tail -c 40000 run_console.log 2>/dev/null || echo "(no console log)"
          } > data/logs/train_last.txt
          git add data/logs/train_last.txt
          git commit -m "Train stage log" || true
          bash scripts/push_with_retry.sh

  # The two most recent completed seasons, derived from the date.
  seasons:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.s.outputs.list }}
    steps:
      - id: s
        run: |
          python3 -c "
          from datetime import date
          t = date.today(); cur = t.year if t.month >= 3 else t.year - 1
          print(f'list=[{cur - 2}, {cur - 1}]')" >> "$GITHUB_OUTPUT"

  backtest:
    needs: [train_predict, seasons]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        season: ${{ fromJSON(needs.seasons.outputs.list) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Backtest season ${{ matrix.season }}
        run: |
          set -o pipefail
          python -u model/pipeline.py --mode backtest --backtest-season ${{ matrix.season }} 2>&1 | tee -a run_console.log

      - name: Upload fragment
        uses: actions/upload-artifact@v4
        with:
          name: backtest-fragment-${{ matrix.season }}
          path: data/predictions/backtest_fragments/backtest_${{ matrix.season }}.json

      # Anonymous visitors cannot read Actions logs — commit the failure tail.
      - name: Publish failure log
        if: failure()
        run: |
          git config user.name  "NFL Predictor Bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          {
            echo "=== backtest ${{ matrix.season }} $(date -u '+%Y-%m-%dT%H:%MZ') — status: FAILURE ==="
            tail -c 30000 run_console.log 2>/dev/null || echo "(no console log)"
          } > data/logs/backtest_${{ matrix.season }}_fail.txt
          git add data/logs/backtest_${{ matrix.season }}_fail.txt
          git commit -m "Backtest ${{ matrix.season }} failure log" || true
          bash scripts/push_with_retry.sh

  merge_backtests:
    needs: [train_predict, backtest]
    if: ${{ always() && needs.train_predict.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          pattern: backtest-fragment-*
          merge-multiple: true
          path: data/predictions/backtest_fragments/

      - name: Merge fragments
        run: python3 scripts/merge_backtests.py 2>&1 | tee -a merge_console.log

      - name: Commit backtest results + log
        if: always()
        run: |
          git config user.name  "NFL Predictor Bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          {
            echo "=== full_pipeline $(date -u '+%Y-%m-%dT%H:%MZ') — merge status: ${{ job.status }} ==="
            echo "backtest jobs: ${{ needs.backtest.result }}"
            echo "--- merge log ---"
            cat merge_console.log 2>/dev/null || echo "(no merge log)"
          } > data/logs/backtest_last.txt
          git add data/logs/backtest_last.txt data/predictions/backtest_results.json \
                  docs/assets/backtest_results.json
          git diff --staged --quiet || git commit -m "Backtest results — $(date -u '+%Y-%m-%d %H:%M')"
          bash scripts/push_with_retry.sh
