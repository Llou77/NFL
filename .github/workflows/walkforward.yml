# Walk-forward validation: one PARALLEL job per held-out season (2013 → last
# completed season), each trained only on the 4 seasons before it, then a
# merge job that summarises model vs Vegas and draws the chart for
# docs/walkforward.html. Uses only the committed data/frozen/ layer.
#
# Trigger: Actions UI, `gh workflow run walkforward.yml`, or a push touching
# .walkforward-trigger
name: Walk-Forward Simulation

on:
  push:
    branches: [main]
    paths: ['.walkforward-trigger']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nfl-pipeline
  cancel-in-progress: false

jobs:
  seasons:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.s.outputs.list }}
    steps:
      - id: s
        run: |
          python3 -c "
          from datetime import date
          t = date.today(); cur = t.year if t.month >= 3 else t.year - 1
          print('list=' + str(list(range(2013, cur))))" >> "$GITHUB_OUTPUT"

  fold:
    needs: seasons
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        season: ${{ fromJSON(needs.seasons.outputs.list) }}
        window: [4]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies (CPU-only torch)
        run: |
          pip install torch==2.3.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Fold ${{ matrix.season }} / window ${{ matrix.window }}
        run: |
          set -o pipefail
          python -u model/walkforward.py --test-season ${{ matrix.season }} \
            --window ${{ matrix.window }} 2>&1 | tee -a run_console.log

      - name: Upload fragment
        uses: actions/upload-artifact@v4
        with:
          name: wf-w${{ matrix.window }}-${{ matrix.season }}
          path: data/predictions/walkforward/wf_w${{ matrix.window }}_${{ matrix.season }}.json

      - name: Publish failure log
        if: failure()
        run: |
          git config user.name  "NFL Predictor Bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          {
            echo "=== walkforward ${{ matrix.season }}/w${{ matrix.window }} $(date -u '+%Y-%m-%dT%H:%MZ') — status: FAILURE ==="
            tail -c 30000 run_console.log 2>/dev/null || echo "(no console log)"
          } > data/logs/wf_${{ matrix.window }}_${{ matrix.season }}_fail.txt
          git add data/logs/wf_${{ matrix.window }}_${{ matrix.season }}_fail.txt
          git commit -m "Walk-forward ${{ matrix.season }}/w${{ matrix.window }} failure log" || true
          bash scripts/push_with_retry.sh

  merge:
    needs: fold
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install plot dependency
        run: pip install matplotlib

      - uses: actions/download-artifact@v4
        with:
          pattern: wf-w*
          merge-multiple: true
          path: data/predictions/walkforward/

      - name: Merge + summarise + plot
        run: python3 scripts/merge_walkforward.py 2>&1 | tee -a merge_console.log

      - name: Commit results
        if: always()
        run: |
          git config user.name  "NFL Predictor Bot"
          git config user.email "nfl-bot@users.noreply.github.com"
          {
            echo "=== walkforward merge $(date -u '+%Y-%m-%dT%H:%MZ') — status: ${{ job.status }} ==="
            echo "fold jobs: ${{ needs.fold.result }}"
            echo "--- merge log ---"
            cat merge_console.log 2>/dev/null || echo "(no merge log)"
          } > data/logs/walkforward_last.txt
          git add data/logs/walkforward_last.txt
          git add data/predictions/walkforward_results.json docs/assets/walkforward_results.json \
                  docs/assets/walkforward_chart.png 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Walk-forward results — $(date -u '+%Y-%m-%d %H:%M')"
          bash scripts/push_with_retry.sh
